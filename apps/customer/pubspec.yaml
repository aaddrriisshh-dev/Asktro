name: asktro_customer
description: ASKTRO customer application.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  shared_flutter:
    path: ../../packages/shared_flutter

  # State management / DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_app_check: ^0.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3

  # Auth providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Payments
  razorpay_flutter: ^1.3.7
  # NOTE: agora_rtc_engine (voice/video) is temporarily removed — its prebuilt
  # AARs share the io.agora.rtc namespace which modern AGP rejects. Voice/video
  # calls are staged for a dedicated "calls" phase; chat consultations work now.

  # Networking (birth-place geocoding search)
  http: ^1.2.2

  # UI / utils
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1   # render the ProKerala kundli chart (SVG)
  intl: ^0.19.0

  # Downloadable Kundali Match report (generate + share/save a PDF)
  pdf: ^3.11.1
  printing: ^5.13.2
  # Save the PDF straight to the phone's Files (SAF save dialog; no storage
  # permission needed). Used for the plain "Download" action.
  flutter_file_dialog: ^3.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5

  # Native share sheet (referral invite -> WhatsApp / anywhere)
  share_plus: ^10.1.4

  # Short in-app chime (e.g. the AI astrologer "has joined" cue). SystemSound is
  # near-silent on iOS, so we play a bundled asset for a reliable audible beep.
  audioplayers: ^6.1.0

# agora_rtc_engine still pins ffi ^1.1.2 (<2.0), which collides with share_plus
# (and other modern plugins) that need ffi ^2. Force ffi 2.x for everyone — the
# FFI surface Agora/iris use is stable across the 1→2 bump (2.0 only dropped
# long-deprecated APIs), so this is the standard, safe resolution.
dependency_overrides:
  ffi: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates native Android/iOS launcher icons from a single source PNG,
  # replacing the default Flutter "blue arrow" icon. Run after dropping in
  # the source image (see flutter_launcher_icons config below):
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# App launcher icon. Drop a square 1024x1024 PNG (transparent or filled) at
# assets/brand/app_icon.png, then run `dart run flutter_launcher_icons` on a
# machine with the native android/ & ios/ folders (i.e. your Mac). The
# adaptive background matches the splash bg (#F5F2FF) so the app-launch zoom
# blends straight into the animated splash with no color flash.
flutter_launcher_icons:
  image_path: "assets/brand/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  # Android 8+ adaptive icon: gold emblem (transparent PNG) floats on the
  # lavender brand background, kept in the mask-safe centre zone.
  adaptive_icon_background: "#F5F2FF"
  adaptive_icon_foreground: "assets/brand/app_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    # Only the Google "G" ships at runtime. The app_icon*.png files in
    # assets/brand/ are build-only sources for flutter_launcher_icons (read at
    # build time by path, below) — bundling the whole folder packed ~2.3 MB of
    # unused launcher-icon PNGs into the app, so we list the one runtime file.
    - assets/brand/google_g.svg
    - assets/illustrations/
    - assets/onboarding/
    - assets/promo/
    - assets/sounds/
    - assets/store/
