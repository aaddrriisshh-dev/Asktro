name: asktro_astrologer
description: ASKTRO astrologer application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  shared_flutter:
    path: ../../packages/shared_flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # NOTE: agora_rtc_engine (voice/video) temporarily removed — see customer
  # pubspec. Voice/video calls are staged for a dedicated phase.
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
